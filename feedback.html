<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback - Mess Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
<a href="student.html">Mess Portal</a>
<span id="studentName"></span>
</header>

<div class="app-layout">

<aside class="sidebar">
<h5>Student Menu</h5>

<a href="student.html">Dashboard</a>
<a href="menu.html">Weekly Menu & Timings</a>
<a href="meal-bookings.html">Meal Bookings</a>
<a href="pass.html">10-Month Pass</a>
<a href="mess-card.html">Digital Mess Card</a>
<a href="billing.html">Billing</a>
<a href="feedback.html">Feedback</a>

<button class="btn btn-outline-light btn-sm mt-3"
onclick="logout()">Logout</button>
</aside>

<main class="page-content">

<h2>Student Feedback</h2>

<div class="card p-3">

<label class="form-label">
Rate your mess experience
</label>

<div class="mb-3">

<button class="btn btn-outline-success"
onclick="setRating(5)">
😃 Excellent
</button>

<button class="btn btn-outline-secondary"
onclick="setRating(3)">
😐 Average
</button>

<button class="btn btn-outline-danger"
onclick="setRating(1)">
😞 Poor
</button>

<span id="ratingText" class="small text-muted ms-2">
Choose a rating
</span>

</div>

<label for="fbComment" class="form-label">
Your comments
</label>

<textarea id="fbComment"
class="form-control mb-3"
rows="4"
placeholder="Write your feedback"></textarea>

<button class="btn btn-primary"
onclick="submitFeedback()">
Submit Feedback
</button>

</div>
</main>
</div>

<script src="script.js"></script>
</body>
</html>
