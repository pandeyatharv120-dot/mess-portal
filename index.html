<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Portal - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">

<div class="login-card card shadow">
<div class="card-body p-4">

<h2 class="text-center text-success">
Mess Management Portal
</h2>

<p class="text-center text-muted">
Demo login — choose your role
</p>

<form id="loginForm">

<label class="form-label" for="email">Email</label>
<input class="form-control mb-3" id="email"
type="email" placeholder="you@college.edu" required>

<label class="form-label" for="password">Password</label>
<input class="form-control mb-3" id="password"
type="password" placeholder="Demo password" required>

<label class="form-label" for="roleSelect">Role</label>

<select id="roleSelect" class="form-select mb-3" required>
<option value="">Select role</option>
<option value="student">Student</option>
<option value="manager">Manager</option>
</select>

<button class="btn btn-success w-100">Login</button>
</form>

<div class="text-center mt-3 small text-muted">
Quick demo buttons
</div>

<div class="d-flex gap-2 mt-2">
<button class="btn btn-outline-success w-50 demo-btn"
data-role="student">Student Demo</button>

<button class="btn btn-outline-primary w-50 demo-btn"
data-role="manager">Manager Demo</button>
</div>

<p class="small text-muted text-center mt-3 mb-0">
Demo project only. No real payment is collected.
</p>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
